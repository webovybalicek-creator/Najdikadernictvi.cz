name: Import ze živnostenského rejstříku

on:
  workflow_dispatch:
    inputs:
      max_minut:
        description: 'Kolik minut nejvýš dotazovat ARES (zbytek pokračuje příště)'
        required: false
        default: '300'
  schedule:
    # denně ve 2:23 UTC – dokud není cache kompletní, doplňuje; pak jen obnovuje staré záznamy
    - cron: '23 2 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pyproj

      - run: python scripts/import-registr.py
        env:
          MAX_MINUT: ${{ inputs.max_minut || '300' }}

      - name: Commit dat
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data-raw src/data/registr.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Aktualizace dat z živnostenského rejstříku"
            git pull --rebase -X theirs origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Spuštění deploye
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
