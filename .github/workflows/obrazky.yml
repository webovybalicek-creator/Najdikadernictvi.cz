name: Stažení obrázků (Unsplash)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/obrazky.json']

permissions:
  contents: write

jobs:
  obrazky:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stažení chybějících obrázků
        run: |
          mkdir -p src/assets/blog
          jq -c '.[]' scripts/obrazky.json | while read -r o; do
            f="src/assets/blog/$(echo "$o" | jq -r .soubor)"
            id=$(echo "$o" | jq -r .id)
            [ -s "$f" ] && continue
            curl -sSfL --retry 3 -o "$f" "https://images.unsplash.com/photo-$id?w=1800&q=82&fm=jpg&fit=max" || { echo "::warning::Nestaženo: $f"; rm -f "$f"; }
          done
          ls -la src/assets/blog
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/blog
          git diff --cached --quiet || { git commit -m "Obrázky pro blog (Unsplash)"; git pull --rebase origin main; git push; }
