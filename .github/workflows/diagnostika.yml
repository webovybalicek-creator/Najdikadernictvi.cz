name: Diagnostika

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Kontrola živého webu
        run: |
          for u in robots.txt ads.txt sitemap.xml; do
            R=$(curl -s -o /tmp/f -w "%{http_code}" "https://najdikadernictvi.cz/$u")
            echo "::notice::$u → $R | $(head -c 160 /tmp/f | tr '\n' ' ')"
          done
          H=$(curl -s https://najdikadernictvi.cz/)
          echo "::notice::úvod: robots=$(echo "$H" | grep -o 'name="robots" content="[^"]*"') | adsense=$(echo "$H" | grep -o 'client=ca-pub-[0-9]*' | head -1)"
          R=$(curl -s -o /dev/null -w "%{http_code} → %{redirect_url}" http://www.najdikadernictvi.cz/brno/)
          echo "::notice::http://www → $R"
          echo "::notice::počet URL v sitemap: $(curl -s https://najdikadernictvi.cz/sitemap.xml | grep -o '<url>' | wc -l)"
