name: Diagnostika

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Kontrola obrázků a hlaviček
        run: |
          W=https://najdikadernictvi.cz
          H=$(curl -s $W/blog/)
          for u in $(echo "$H" | grep -oE '/_astro/[^" ]+\.(avif|webp|jpg)' | sort -u | head -4); do
            echo "::notice::$u → $(curl -s -o /dev/null -w '%{http_code} %{content_type} %{size_download}B' $W$u) | $(curl -sI $W$u | grep -i 'cache-control' | tr -d '\r')"
          done
          CSS=$(echo "$H" | grep -oE '/_astro/[^"]+\.css' | head -1)
          echo "::notice::css $CSS → $(curl -s -o /dev/null -w '%{http_code} %{content_type}' $W$CSS)"
          echo "::notice::blog <picture>: $(echo "$H" | grep -o '<picture' | wc -l), <img: $(echo "$H" | grep -o '<img' | wc -l)"
          D=$(curl -s $W/brno/afroucesy/)
          P=$(echo "$D" | grep -oE '/api/panorama\.php\?[^"]+' | head -1 | sed 's/&amp;/\&/g')
          echo "::notice::panorama $P → $(curl -s -o /tmp/p -w '%{http_code} %{content_type} %{size_download}B' -H 'Accept: image/avif,image/webp,*/*' "$W$P") | $(head -c 120 /tmp/p | tr -dc '[:print:]')"
          echo "::notice::úvod html → $(curl -sI $W/ | grep -iE 'cache-control|content-type' | tr -d '\r' | tr '\n' ' ')"
          echo "::notice::og.jpg → $(curl -s -o /dev/null -w '%{http_code} %{content_type}' $W/og.jpg)"
