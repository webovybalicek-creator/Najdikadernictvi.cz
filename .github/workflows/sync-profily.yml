name: Synchronizace profilů od majitelů

# Stáhne údaje, které majitelé upravili přes /sprava/, do src/data/majitele.json a při změně spustí deploy.
on:
  workflow_dispatch:
  schedule:
    - cron: '41 */3 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: import
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stažení profilů
        run: |
          curl -sSf --retry 3 -A "najdikadernictvi-sync" "https://najdikadernictvi.cz/api/sprava.php?export=1" -o /tmp/export.json
          jq -e '.salony | type == "object"' /tmp/export.json > /dev/null
          jq --sort-keys '{ "_popis": "Profily upravené majiteli přes /sprava/. Soubor přepisuje workflow Synchronizace profilů, ručně neupravovat (ruční opravy patří do overene.json).", salony: .salony }' /tmp/export.json > src/data/majitele.json
          echo "::notice::Profilů od majitelů: $(jq '.salony | length' src/data/majitele.json)"

      - name: Stažení hodnocení
        run: |
          # Schválené recenze a souhrn hvězdiček do HTML (vidí je Google). Když export selže, ponechá se poslední verze.
          if curl -sSf --retry 3 -A "najdikadernictvi-sync" "https://najdikadernictvi.cz/api/hodnoceni.php?export=1" -o /tmp/hodnoceni.json \
             && jq -e '(.souhrn | type == "object") and (.recenze | type == "object")' /tmp/hodnoceni.json > /dev/null; then
            jq --sort-keys '{ "_popis": "Hodnocení návštěvníků (souhrn [průměr, počet] a schválené texty). Soubor přepisuje workflow Synchronizace profilů, ručně neupravovat.", souhrn: .souhrn, recenze: .recenze }' /tmp/hodnoceni.json > src/data/hodnoceni.json
            echo "::notice::Hodnocených salonů: $(jq '.souhrn | length' src/data/hodnoceni.json)"
          else
            echo "::warning::Export hodnocení se nepodařil, ponechávám poslední verzi."
          fi

      - name: Stažení cen od návštěvníků
        run: |
          # Mediány cen střihu podle salonu (štítek „střih od“, filtr a řazení podle ceny). Když export selže, ponechá se poslední verze.
          if curl -sSf --retry 3 -A "najdikadernictvi-sync" "https://najdikadernictvi.cz/api/ceny.php?export=1" -o /tmp/ceny.json \
             && jq -e '.salony | type == "object"' /tmp/ceny.json > /dev/null; then
            jq --sort-keys '{ "_popis": "Mediány cen od návštěvníků podle salonu (jen služby s aspoň 3 odpověďmi). Soubor přepisuje workflow Synchronizace profilů, ručně neupravovat.", salony: .salony }' /tmp/ceny.json > src/data/ceny.json
            echo "::notice::Salonů s cenou od návštěvníků: $(jq '.salony | length' src/data/ceny.json)"
          else
            echo "::warning::Export cen se nepodařil, ponechávám poslední verzi."
          fi

      - name: Commit
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/majitele.json src/data/hodnoceni.json src/data/ceny.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Profily od majitelů"
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Spuštění deploye
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main

      - name: Upozornění na nové salony
        if: always()
        run: curl -sS --retry 2 -A "najdikadernictvi-sync" "https://najdikadernictvi.cz/api/upozorneni.php?akce=rozeslat" || true
